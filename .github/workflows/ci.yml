name: CIFAR-10 Enterprise CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Linting & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 bandit pytest
        
    - name: Code Formatting Check (Black)
      run: black --check .
      
    - name: Lint Analysis (Flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
    - name: Security Audit (Bandit)
      run: bandit -r src/ -ll
      
    - name: Unit Tests (Pytest)
      run: |
        # Ensure we can run tests without trying to GPU training
        export APP_ENV=test
        pytest tests/

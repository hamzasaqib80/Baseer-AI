version: '3.8'

services:
  inference-api:
    build: .
    container_name: cifar10_inference_service
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models # Mount models for hot-swapping if needed
      - ./monitoring:/app/monitoring # Persist logs/reports
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
